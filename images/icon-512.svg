<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="rgba(59,130,246,0.15)" stroke-width="2"/>
  <!-- Hotel Building -->
  <g transform="translate(256,240)" filter="url(#glow)">
    <!-- Main building -->
    <rect x="-70" y="-80" width="140" height="160" rx="8" fill="url(#accent)" opacity="0.9"/>
    <!-- Left wing -->
    <rect x="-120" y="-40" width="50" height="120" rx="6" fill="url(#accent)" opacity="0.7"/>
    <!-- Right wing -->
    <rect x="70" y="-40" width="50" height="120" rx="6" fill="url(#accent)" opacity="0.7"/>
    <!-- Windows main -->
    <rect x="-50" y="-60" width="20" height="20" rx="3" fill="rgba(255,255,255,0.85)"/>
    <rect x="-10" y="-60" width="20" height="20" rx="3" fill="rgba(255,255,255,0.85)"/>
    <rect x="30" y="-60" width="20" height="20" rx="3" fill="rgba(255,255,255,0.85)"/>
    <rect x="-50" y="-25" width="20" height="20" rx="3" fill="rgba(255,255,255,0.7)"/>
    <rect x="-10" y="-25" width="20" height="20" rx="3" fill="rgba(255,255,255,0.7)"/>
    <rect x="30" y="-25" width="20" height="20" rx="3" fill="rgba(255,255,255,0.7)"/>
    <rect x="-50" y="10" width="20" height="20" rx="3" fill="rgba(255,255,255,0.55)"/>
    <rect x="-10" y="10" width="20" height="20" rx="3" fill="rgba(255,255,255,0.55)"/>
    <rect x="30" y="10" width="20" height="20" rx="3" fill="rgba(255,255,255,0.55)"/>
    <!-- Door -->
    <rect x="-15" y="45" width="30" height="35" rx="4" fill="rgba(255,255,255,0.9)"/>
    <!-- Wing windows -->
    <rect x="-108" y="-20" width="16" height="16" rx="2" fill="rgba(255,255,255,0.6)"/>
    <rect x="-108" y="10" width="16" height="16" rx="2" fill="rgba(255,255,255,0.5)"/>
    <rect x="-108" y="40" width="16" height="16" rx="2" fill="rgba(255,255,255,0.4)"/>
    <rect x="82" y="-20" width="16" height="16" rx="2" fill="rgba(255,255,255,0.6)"/>
    <rect x="82" y="10" width="16" height="16" rx="2" fill="rgba(255,255,255,0.5)"/>
    <rect x="82" y="40" width="16" height="16" rx="2" fill="rgba(255,255,255,0.4)"/>
    <!-- Roof accent -->
    <rect x="-30" y="-95" width="60" height="15" rx="7" fill="rgba(251,191,36,0.9)"/>
  </g>
  <!-- Brand text -->
  <text x="256" y="420" text-anchor="middle" font-family="Georgia,serif" font-size="48" font-weight="700" fill="white" letter-spacing="8">LUXE</text>
</svg>
